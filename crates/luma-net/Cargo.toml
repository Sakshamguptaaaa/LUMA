[package]
name = "luma-net"
version = "0.1.0"
edition = "2021"
description = "Network clients for LUMA's model providers (Gemini, Groq, Ollama, AssemblyAI, Sarvam)."

[dependencies]
luma-core = { path = "../luma-core" }
anyhow = "1"
base64 = "0.23"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
